<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    body.dark {
      --bg: #18181b;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --border: #3f3f46;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 260px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      padding: 14px 16px 10px;
      font-weight: 600;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }
    .themes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 16px;
    }
    .themes button {
      padding: 10px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--fg);
      font: inherit;
      cursor: pointer;
    }
    .themes button.active {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .row {
      padding: 0 16px 12px;
    }
    .row label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 16px 14px;
      cursor: pointer;
    }
    footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    kbd {
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font: 11px ui-monospace, monospace;
    }
    .disabled { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <header>Tema do sistema Codxis</header>

  <div class="themes">
    <button id="light">☀ Claro</button>
    <button id="dark">☾ Escuro</button>
  </div>

  <div id="tuning">
    <div class="row">
      <label for="intensity"><span>Intensidade</span><span id="intensityVal"></span></label>
      <input id="intensity" type="range" min="70" max="100" step="1" />
    </div>
    <div class="row">
      <label for="contrast"><span>Contraste</span><span id="contrastVal"></span></label>
      <input id="contrast" type="range" min="80" max="120" step="1" />
    </div>
  </div>

  <label class="check">
    <input id="showButton" type="checkbox" />
    Mostrar botão flutuante na página
  </label>

  <footer>Atalho: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd></footer>

  <script src="popup.js"></script>
</body>
</html>
